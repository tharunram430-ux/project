
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>PhishGuard | Login</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;

            font-family: Arial, sans-serif;

            background:
                radial-gradient(
                    circle at top left,
                    #173b5f,
                    transparent 40%
                ),
                radial-gradient(
                    circle at bottom right,
                    #30134d,
                    transparent 40%
                ),
                #050914;

            color: white;

            display: flex;

            justify-content: center;

            align-items: center;
        }

        /* LOGIN CARD */

        .login-card {

            width: 400px;

            padding: 40px;

            background: #0d1b2a;

            border: 1px solid #29435a;

            border-radius: 18px;

            box-shadow:
                0 20px 50px rgba(0,0,0,.4);
        }

        /* LOGO */

        .logo {

            text-align: center;

            font-size: 50px;

            margin-bottom: 10px;
        }

        h1 {

            text-align: center;

            font-size: 25px;

            letter-spacing: 3px;
        }

        h1 span {

            color: #00c8ff;
        }

        .subtitle {

            text-align: center;

            color: #7891a6;

            font-size: 12px;

            margin-top: 8px;

            margin-bottom: 30px;

            letter-spacing: 1px;
        }

        /* LABEL */

        label {

            display: block;

            color: #9aabba;

            font-size: 12px;

            margin-bottom: 7px;
        }

        /* INPUT */

        input {

            width: 100%;

            padding: 14px;

            margin-bottom: 20px;

            background: #07111f;

            color: white;

            border: 1px solid #29435a;

            border-radius: 8px;

            font-size: 15px;

            outline: none;
        }

        input:focus {

            border-color: #00c8ff;
        }

        /* BUTTON */

        button {

            width: 100%;

            padding: 14px;

            background: #008cff;

            color: white;

            border: none;

            border-radius: 8px;

            font-size: 15px;

            font-weight: bold;

            cursor: pointer;
        }

        button:hover {

            background: #006dcc;
        }

        /* ERROR */

        .error {

            background: #35151a;

            border: 1px solid #84313d;

            color: #ff7583;

            padding: 12px;

            border-radius: 8px;

            margin-bottom: 20px;

            text-align: center;

            font-size: 13px;
        }

        /* STATUS */

        .status {

            text-align: center;

            margin-top: 25px;

            color: #667f94;

            font-size: 11px;
        }

        .dot {

            display: inline-block;

            width: 7px;

            height: 7px;

            background: #00ff9d;

            border-radius: 50%;

            margin-right: 5px;
        }

        /* MOBILE */

        @media(max-width:500px) {

            .login-card {

                width: 90%;

                padding: 30px;
            }

        }

    </style>

</head>


<body>


<div class="login-card">


    <!-- LOGO -->

    <div class="logo">
        🛡️
    </div>


    <h1>
        PHISH<span>GUARD</span>
    </h1>


    <div class="subtitle">
        AI URL INTELLIGENCE SYSTEM
    </div>


    <!-- ERROR -->

    {% if error %}

        <div class="error">

            ⚠️ {{ error }}

        </div>

    {% endif %}


    <!-- LOGIN FORM -->

    <form
        method="POST"
        action="{{ url_for('login') }}"
    >


        <label for="username">
            USERNAME
        </label>


        <input
            type="text"
            id="username"
            name="username"
            placeholder="Enter username"
            autocomplete="username"
            required
        >


        <label for="password">
            PASSWORD
        </label>


        <input
            type="password"
            id="password"
            name="password"
            placeholder="Enter password"
            autocomplete="current-password"
            required
        >


        <button type="submit">
            ENTER SYSTEM
        </button>


    </form>


    <!-- STATUS -->

    <div class="status">

        <span class="dot"></span>

        SECURITY SYSTEM ACTIVE

    </div>


</div>


</body>

</html>
